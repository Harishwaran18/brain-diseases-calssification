[project]
name = "brainframe"
version = "0.1.0"
description = "Retraining-free AI framework for 3D neurodegenerative brain reconstruction and computational therapy evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "brainframe contributors" }]
keywords = ["MRI", "SAM", "segmentation", "3D-reconstruction", "neuroscience", "PyTorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "nibabel>=5.1",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "trimesh>=4.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
    "monai>=1.3",
]
sam = [
    "segment-anything>=1.0",
    "torch>=2.1",
    "torchvision>=0.16",
]
viz = [
    "pyvista>=0.43",
    "plotly>=5.18",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.scripts]
brainframe = "brainframe.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/brain-diseases-calssification"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brainframe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
