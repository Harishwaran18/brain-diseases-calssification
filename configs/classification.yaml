# Brain-disease classification baseline (supervised, data-hungry contrast).
classification:
  model:
    name: densenet3d  # densenet3d | resnet3d | slice_ensemble
    in_channels: 1
    num_classes: 4  # healthy | early | moderate | advanced neurodegeneration
    spatial_dims: 3
    pretrained: false
  slice_ensemble:
    backbone: resnet18
    slice_axis: 2
    aggregation: mean  # mean | max | attention
  train:
    epochs: 50
    batch_size: 2
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    optimizer: adamw  # adamw | sgd
    scheduler: cosine  # cosine | step | none
    amp: true
    early_stopping:
      patience: 8
      metric: val_loss
      mode: min
    checkpoint: data/outputs/classification_best.pt
  data:
    dataset: oasis
    split:
      train: 0.7
      val: 0.15
      test: 0.15
      stratify: true
    patch_size: [96, 96, 96]
    augment: true
  metrics:
    primary: accuracy
    track: [accuracy, f1, auc, sensitivity, specificity]
